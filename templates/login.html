
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeHub | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #000;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 420px;
            max-width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 0 30px #333;
            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 30px;
            letter-spacing: 3px;
        }

        .brand p {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #888;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #000;
            border-color: #000;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 2px solid #000;
            border-radius: 7px;
            background: #000;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        .message {
            padding: 12px;
            background: #eee;
            border-left: 4px solid #000;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .links {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            line-height: 2;
        }

        a {
            color: #000;
            font-weight: bold;
        }

        .footer {
            border-top: 1px solid #ddd;
            margin-top: 25px;
            padding-top: 18px;
            color: #777;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <header class="brand">
            <h1>RECIPEHUB</h1>
            <p>Welcome back! Sign in to share your favourite recipes.</p>
        </header>

        {% if message %}
        <div class="message" role="alert">
            {{ message }}
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="field">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">SIGN IN</button>
        </form>

        <div class="links">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Create account</a>
            <br>
            <a href="{{ url_for('home') }}">Back to RecipeHub</a>
        </div>

        <div class="footer">
            Authentication powered by Amazon Cognito
        </div>
    </main>
</body>
</html>
