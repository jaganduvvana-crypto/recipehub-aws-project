<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Platform - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 420px;
            max-width: 90%;
            background: #fff;
            color: #000;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        .logo p {
            margin-top: 8px;
            color: #555;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #000;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            background: #f2f2f2;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px;
            background: #eee;
            border-left: 4px solid #000;
            font-size: 14px;
        }

        .bottom {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .bottom a {
            color: #000;
            font-weight: bold;
            text-decoration: underline;
        }

        .security {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <h1>RECIPEHUB</h1>
            <p>Create your account and share your recipes</p>
        </div>

        {% if message %}
        <div class="message">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" action="/signup">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                CREATE ACCOUNT
            </button>

        </form>

        <div class="bottom">
            Already have an account?
            <a href="/">Go to RecipeHub</a>
        </div>

        <div class="security">
            Authentication is securely handled by Amazon Cognito.
        </div>

    </div>

</body>
</html>
